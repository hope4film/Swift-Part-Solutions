<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>{% block title %}Swift Part Solutions{% endblock %}</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="{{ url_for('static', path='styles.css') }}">
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>

{% block scripts %}{% endblock %}

<body class="bg-[#1E1E20] text-white font-sans min-h-screen flex flex-col">

  <!-- Top Navigation -->
  <header class="bg-[#1A1A1D] border-b border-[#2A2A2E] px-6 py-4 flex justify-between items-center shadow-sm">
    <a href="/" class="text-base font-semibold tracking-tight hover:text-[#FE6900]">
      Swift Part Solutions
   </a>
  {% if request.session.get('user') %}
  <div class="relative inline-block text-left">
    <button id="menu-button" aria-label="Menu" aria-haspopup="true" aria-expanded="false" aria-controls="menu-dropdown" class="text-white hover:text-[#FE6900]">
      <i class="fas fa-bars text-xl"></i>
    </button>
    <div id="menu-dropdown" class="hidden absolute right-0 mt-2 w-40 bg-gray-700 rounded shadow-lg z-50 space-y-1">
      <a href="/snapgo" class="block px-4 py-2 text-sm text-white hover:bg-gray-600">SnapGo</a>
      <a href="/chat_log" class="block px-4 py-2 text-sm hover:bg-gray-700">📝 Chat History</a>
      <a href="/truck_stock" class="block px-4 py-2 text-sm text-white hover:bg-gray-600">Truck Stock</a>
      <a href="/jobs" class="block px-4 py-2 text-sm text-white hover:bg-gray-600">Jobs</a>
      <a href="/account" class="block px-4 py-2 text-sm text-white hover:bg-gray-600">Account</a>
      <a href="/logout" class="block px-4 py-2 text-sm text-white hover:bg-gray-600">Logout</a>
    </div>
  </div>
  {% endif %}
  </header>


  <!-- Content Slot -->
  <main class="flex-1 w-full max-w-4xl mx-auto px-4 py-6">
    {% block content %}{% endblock %}
  </main>

  <!-- Optional Footer -->
  <footer class="text-xs text-gray-500 text-center py-4 border-t border-gray-800">
    Swift Part Solutions &copy; 2025
  </footer>


</body>
</html>
